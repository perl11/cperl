#
# Run the cperl tests on various build configurations and operating systems.
#
name: testsuite

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "*"
  pull_request:

env:
  PERL_SKIP_TTY_TEST: 1
  CONTINUOUS_INTEGRATION: 1

permissions:
  contents: read # to fetch code

jobs:
  linux:
    name: linux ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            configure: ""
          - name: threads
            configure: "-Dusethreads"
          - name: debugging
            configure: "-DDEBUGGING"
          - name: quadmath-longdouble
            configure: "-Duselongdouble"
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential libgdbm-dev libffi-dev
      - name: Configure
        run: ./Configure -des -Dusedevel -Uversiononly -Accflags=-fno-strict-aliasing -Dprefix=$HOME/cperl/usr ${{ matrix.configure }}
      - name: Build
        run: make -s -j$(nproc) ECHO=true
      - name: Test
        env:
          TEST_JOBS: 4
        run: make test_harness

  asan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: ./Configure -des -Dusedevel -Uversiononly -Accflags=-fno-strict-aliasing -DDEBUGGING -Accflags='-fsanitize=address -fno-omit-frame-pointer' -Aldflags=-fsanitize=address -Alddlflags=-fsanitize=address
      - name: Build
        run: make -s -j$(nproc) ECHO=true
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
          TEST_JOBS: 4
        run: make test_harness

  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: ./Configure -des -Dusedevel -Uversiononly -Accflags=-fno-strict-aliasing
      - name: Build
        run: make -s -j$(sysctl -n hw.ncpu) ECHO=true
      - name: Test
        env:
          TEST_JOBS: 4
        run: make test_harness

  miniperl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: ./Configure -des -Dusedevel -Uversiononly -Accflags=-fno-strict-aliasing
      - name: Build miniperl
        run: make -s -j$(nproc) miniperl ECHO=true
      - name: Test miniperl
        run: make minitest

  windows-msvc:
    name: "Windows msvc142"
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cd win32
          nmake CCTYPE=MSVC142 CFG=Debug
      - name: Show Config
        shell: cmd
        run: |
          .\perl.exe -V
          .\perl.exe -e "use Config; print Config::config_sh"
      - name: Run Tests
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cd win32
          nmake CCTYPE=MSVC142 CFG=Debug test

  mingw64:
    name: "Windows mingw64"
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Install mingw-64
        run: |
          mkdir C:\perl_ci && cd C:\perl_ci
          curl -L https://github.com/brechtsanders/winlibs_mingw/releases/download/13.1.0-16.0.5-11.0.0-ucrt-r5/winlibs-x86_64-posix-seh-gcc-13.1.0-mingw-w64ucrt-11.0.0-r5.zip -o mingw.zip
          $expected_hash = '418E8A0175640E617EC6F6639BCA8D3AEDDB6A108391EAF312D1351D19375958'
          $file_hash = (Get-FileHash mingw.zip -Algorithm SHA256).Hash
          if ($file_hash -ne $expected_hash) {
            throw "Wrong hash. Got ${file_hash}, expected ${expected_hash}"
          }
          tar -xf mingw.zip && rm mingw.zip
          copy mingw64\bin\mingw32-make.exe mingw64\bin\gmake.exe
          echo 'C:\perl_ci\mingw64\bin' >> $env:GITHUB_PATH
      - name: Host perl -V
        run: perl -V
      - name: gcc --version
        run: gcc --version
      - name: Build
        shell: cmd
        run: |
          cd win32
          gmake CCHOME=C:\perl_ci\mingw64 CFG=Debug USE_FFI=undef -f GNUMakefile -j2
      - name: Show Config
        shell: cmd
        run: |
          .\perl.exe -V
          .\perl.exe -e "use Config; print Config::config_sh"
      - name: Run Tests
        shell: cmd
        run: |
          cd win32
          set HARNESS_OPTIONS=j2
          gmake CCHOME=C:\perl_ci\mingw64 CFG=Debug USE_FFI=undef -f GNUMakefile test

  cygwin:
    name: "cygwin"
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Set up Cygwin
        uses: cygwin/cygwin-install-action@v3
        with:
          packages: >
              cygwin-devel gcc-core gcc-g++ make w32api-headers binutils libtool
              git ccache libgdbm-devel libdb-devel libffi-devel
          install-dir: ${{ github.workspace }}\cygwin
      - name: Check out using Cygwin git, to ensure correct file permissions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATH: /usr/bin:/bin
          SHELLOPTS: igncr
        shell: sh
        run: |
          git config --global core.autocrlf false
          mkdir -p ~
          cd ~
          git init work
          cd work
          git remote add origin "https://$GITHUB_ACTOR:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY"
          git config --local gc.auto 0
          git fetch origin --depth=1 "$GITHUB_SHA"
          git checkout "$GITHUB_SHA"
      - name: Configure
        shell: sh
        env:
          PATH: /usr/bin:/bin
          SHELLOPTS: igncr
        run: |
          cd ~/work
          ./Configure -des -Dusedevel -Uversiononly -Accflags=-fno-strict-aliasing -Doptimize=-g -DDEBUGGING || exit 1
      - name: Build
        shell: sh
        env:
          PATH: /usr/bin:/bin
          SHELLOPTS: igncr
        run: |
          cd ~/work
          make -j2 test_prep
      - name: Show Config
        shell: sh
        env:
          PATH: /usr/bin:/bin
          SHELLOPTS: igncr
        run: |
          cd ~/work
          ./perl -Ilib -V
          ./perl -Ilib -e 'use Config; print Config::config_sh'
      - name: Run Tests
        shell: sh
        env:
          PATH: /usr/bin:/bin
          SHELLOPTS: igncr
        # hints/cygwin.sh sets ldlibpthname=PATH, so run the harness directly
        run: |
          cd ~/work
          PATH=`pwd`:.:$PATH TEST_JOBS=2 ./perl.exe t/harness
